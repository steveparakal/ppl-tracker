<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="dots" x="0" y="0" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="6" r="1.2" fill="rgba(255,255,255,0.06)"/>
    </pattern>
    <pattern id="skull-ht" x="0" y="0" width="10" height="10" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="5" r="1.3" fill="#000"/>
    </pattern>
  </defs>

  <!-- solid black background -->
  <rect width="512" height="512" fill="#080808"/>
  <rect width="512" height="512" fill="url(#dots)"/>

  <!-- green slash top-left -->
  <polygon points="0,0 320,0 230,115 0,115" fill="#A3FF12" opacity="0.92"/>
  <polygon points="0,0 320,0 230,115 0,115" fill="url(#dots)" opacity="0.5"/>

  <!-- purple slash bottom-right -->
  <polygon points="512,512 170,512 270,395 512,395" fill="#A855F7" opacity="0.92"/>
  <polygon points="512,512 170,512 270,395 512,395" fill="url(#dots)" opacity="0.5"/>

  <!-- scratch marks green -->
  <rect x="28" y="132" width="110" height="5" fill="#A3FF12" transform="rotate(-3 28 132)" opacity="0.65"/>
  <rect x="55" y="150" width="55" height="3" fill="#A3FF12" transform="rotate(-3 55 150)" opacity="0.4"/>

  <!-- scratch marks purple -->
  <rect x="330" y="368" width="125" height="5" fill="#A855F7" transform="rotate(4 330 368)" opacity="0.65"/>
  <rect x="355" y="385" width="72" height="3" fill="#A855F7" transform="rotate(4 355 385)" opacity="0.4"/>

  <!-- SYS.PPL stamp on green -->
  <g transform="translate(18 14) rotate(-2)">
    <rect x="0" y="0" width="130" height="34" fill="none" stroke="#000" stroke-width="2.5"/>
    <text x="65" y="24" text-anchor="middle" font-family="Impact,'Arial Black',sans-serif" font-size="19" font-weight="900" letter-spacing="2" fill="#000">SYS.PPL</text>
  </g>

  <!-- NO GODS stamp -->
  <g transform="translate(310 22) rotate(8)">
    <rect x="0" y="0" width="110" height="30" fill="#A855F7"/>
    <text x="55" y="21" text-anchor="middle" font-family="Impact,'Arial Black',sans-serif" font-size="15" font-weight="900" letter-spacing="3" fill="#fff">NO GODS</text>
  </g>

  <!-- SKULL: original coords centered at ~(45,50) in a 90x100 box
       scale 3.8, then translate so skull center (45,50)*3.8 = (171,190) lands at (256,256)
       translate = 256-171=85, 256-190=66 -->
  <g transform="translate(85 66) scale(3.8)">
    <!-- purple drop shadow -->
    <path d="M45 8 C22 8 10 24 10 44 C10 58 16 66 22 72 L22 84 L30 84 L30 92 L36 92 L36 84 L42 84 L42 92 L48 92 L48 84 L54 84 L54 92 L60 92 L60 84 L68 84 L68 72 C74 66 80 58 80 44 C80 24 68 8 45 8 Z"
      transform="translate(4 4)" fill="#A855F7" opacity="0.9"/>
    <!-- white skull -->
    <path d="M45 8 C22 8 10 24 10 44 C10 58 16 66 22 72 L22 84 L30 84 L30 92 L36 92 L36 84 L42 84 L42 92 L48 92 L48 84 L54 84 L54 92 L60 92 L60 84 L68 84 L68 72 C74 66 80 58 80 44 C80 24 68 8 45 8 Z"
      fill="#fff" stroke="#111" stroke-width="2"/>
    <!-- halftone on skull -->
    <path d="M45 8 C22 8 10 24 10 44 C10 58 16 66 22 72 L22 84 L30 84 L30 92 L36 92 L36 84 L42 84 L42 92 L48 92 L48 84 L54 84 L54 92 L60 92 L60 84 L68 84 L68 72 C74 66 80 58 80 44 C80 24 68 8 45 8 Z"
      fill="url(#skull-ht)" opacity="0.35"/>
    <!-- eye sockets -->
    <ellipse cx="30" cy="46" rx="10" ry="12" fill="#080808"/>
    <ellipse cx="60" cy="46" rx="10" ry="12" fill="#080808"/>
    <!-- green eye glow -->
    <circle cx="32" cy="44" r="3.2" fill="#A3FF12"/>
    <circle cx="62" cy="44" r="3.2" fill="#A3FF12"/>
    <!-- nose -->
    <path d="M40 62 L45 68 L50 62 L48 66 L45 72 L42 66 Z" fill="#080808"/>
    <!-- teeth lines -->
    <path d="M36 76 L38 82 M42 76 L44 82 M48 76 L50 82 M54 76 L56 82" stroke="#080808" stroke-width="2"/>
  </g>
</svg>
