<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="512" height="512" fill="#080808"/>

  <!-- top bar green → purple → blue -->
  <rect x="0" y="0" width="512" height="18" fill="#A3FF12"/>
  <rect x="0" y="18" width="512" height="18" fill="#A855F7"/>
  <rect x="0" y="36" width="512" height="18" fill="#00B4FF"/>

  <!-- SYS white -->
  <text x="256" y="270" text-anchor="middle"
    font-family="Impact,'Arial Black',sans-serif"
    font-size="148" font-weight="900" letter-spacing="6"
    fill="#ffffff">SYS</text>

  <!-- PPL purple -->
  <text x="256" y="400" text-anchor="middle"
    font-family="Impact,'Arial Black',sans-serif"
    font-size="148" font-weight="900" letter-spacing="6"
    fill="#A855F7">PPL</text>

  <!-- bottom bar blue → purple → green -->
  <rect x="0" y="458" width="512" height="18" fill="#00B4FF"/>
  <rect x="0" y="476" width="512" height="18" fill="#A855F7"/>
  <rect x="0" y="494" width="512" height="18" fill="#A3FF12"/>
</svg>
